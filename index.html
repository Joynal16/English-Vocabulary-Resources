<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English | জানালা</title>

    <!-- Apply saved / system theme before paint (no flash) -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      })();
    </script>

    <!--Fav-Icon-->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style type="text/tailwindcss">
      @custom-variant dark (&:where([data-theme=dark], [data-theme=dark] *));

      @theme {
        --font-sans:
          "Outfit", "Hind Siliguri", ui-sans-serif, system-ui, sans-serif;
        --font-bangla: "Hind Siliguri", "Outfit", sans-serif;
      }
    </style>
  </head>

  <body
    class="relative min-h-screen w-full overflow-hidden flex items-center justify-center px-4 py-10 sm:px-6 bg-linear-to-br from-sky-50 via-white to-indigo-50 text-slate-800 antialiased transition-colors duration-300 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-100"
  >
    <!-- Background glows -->
    <div
      aria-hidden="true"
      class="pointer-events-none absolute -top-24 -left-24 size-72 sm:size-96 rounded-full bg-sky-200/60 blur-3xl dark:bg-sky-500/20"
    ></div>
    <div
      aria-hidden="true"
      class="pointer-events-none absolute -bottom-24 -right-24 size-72 sm:size-96 rounded-full bg-indigo-200/60 blur-3xl dark:bg-indigo-500/20"
    ></div>

    <!-- Theme toggle -->
    <button
      id="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
      class="btn btn-ghost btn-circle absolute top-4 right-4 sm:top-6 sm:right-6 z-10 text-lg text-slate-600 hover:bg-white/70 dark:text-slate-300 dark:hover:bg-slate-800"
    >
      <span class="dark:hidden"><i class="fa-solid fa-moon"></i></span>
      <span class="hidden dark:inline text-amber-300"
        ><i class="fa-solid fa-sun"></i
      ></span>
    </button>

    <main class="relative w-full max-w-md">
      <!-- Brand -->
      <div class="text-center mb-6 sm:mb-8">
        <div
          class="mx-auto mb-4 grid place-items-center size-20 sm:size-24 rounded-3xl bg-white p-3 shadow-xl shadow-sky-100 ring-1 ring-slate-200/70 dark:bg-slate-900 dark:shadow-none dark:ring-slate-800"
        >
          <img src="assets/logo.png" alt="ইংলিশ জানালা" class="w-full h-auto" />
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
          <span
            class="bg-linear-to-r from-sky-500 to-indigo-600 bg-clip-text text-transparent dark:from-sky-400 dark:to-indigo-400"
            >English</span
          >
          <span class="font-bangla font-semibold">জানালা</span>
        </h1>
        <p class="mt-2 text-sm sm:text-base text-slate-500 dark:text-slate-400">
          Welcome back! Log in to continue learning.
        </p>
      </div>

      <!-- Login Form -->
      <div
        class="form rounded-3xl border border-slate-200/70 bg-white/80 backdrop-blur-xl p-6 sm:p-8 shadow-2xl shadow-sky-100/70 dark:border-slate-800 dark:bg-slate-900/80 dark:shadow-none"
      >
        <fieldset class="fieldset w-full gap-1">
          <!-- Mobile Number -->
          <label
            for="Number"
            class="label font-semibold text-sm sm:text-base text-slate-700 dark:text-slate-200"
          >
            Enter the Number
          </label>
          <label
            class="input w-full h-12 rounded-full bg-slate-50 border-slate-200 text-sm sm:text-base dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"
          >
            <i class="fa-solid fa-phone text-slate-400"></i>
            <input
              value="12345678910"
              id="Number"
              maxlength="11"
              minlength="11"
              inputmode="numeric"
              type="text"
              placeholder="Enter your number"
            />
          </label>

          <!-- PIN -->
          <label
            for="Pin"
            class="label mt-3 font-semibold text-sm sm:text-base text-slate-700 dark:text-slate-200"
          >
            Pin Number
          </label>
          <label
            class="input w-full h-12 rounded-full bg-slate-50 border-slate-200 text-sm sm:text-base dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"
          >
            <i class="fa-solid fa-lock text-slate-400"></i>
            <input
              value="1234"
              id="Pin"
              maxlength="4"
              inputmode="numeric"
              type="password"
              placeholder="Enter 4 Digit Pin"
            />
          </label>

          <!-- Login Button -->
          <button
            id="btn-login"
            class="btn btn-primary mt-6 h-12 w-full rounded-full text-sm sm:text-base shadow-lg shadow-sky-200 dark:shadow-none"
          >
            Login
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </fieldset>
      </div>

      <p
        class="mt-6 text-center text-xs sm:text-sm text-slate-500 dark:text-slate-400"
      >
        Learn English, one lesson at a time.
      </p>
    </main>

    <script>
      document
        .getElementById("theme-toggle")
        .addEventListener("click", function () {
          var root = document.documentElement;
          var next =
            root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        });
    </script>
    <script src="./Script/login.js"></script>
  </body>
</html>
